<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1on1相談（SOAP） | Fusion Partners</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>">
<script src="mitsumeru_core.js"></script>
<style>
:root {
  --bg:#0f1923; --surface:#1a2634; --card:#223044;
  --accent:#4fc3f7; --accent2:#81c784; --accent3:#ffb74d;
  --text:#e8eaf0; --sub:#8fa3b8; --border:#2e4460; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;min-height:100vh;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
header h1{font-size:0.95rem;font-weight:700;color:var(--accent);}
header p{font-size:0.72rem;color:var(--sub);margin-top:2px;}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h2{font-size:0.85rem;color:var(--accent);margin-bottom:8px;}
.empty-state{font-size:0.8rem;color:var(--sub);padding:8px 0;}
label{font-size:0.78rem;color:var(--sub);display:block;margin-bottom:4px;}
select,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px;font-size:0.85rem;margin-bottom:10px;}
textarea{min-height:90px;}
.btn-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
button{border:0;border-radius:8px;padding:9px 14px;font-size:0.8rem;cursor:pointer;}
.btn-primary{background:var(--accent);color:#04202f;font-weight:700;}
.btn-secondary{background:var(--surface);color:var(--sub);border:1px solid var(--border);}
.note{font-size:0.72rem;color:var(--sub);margin-top:8px;line-height:1.6;}
.soap-block{border-left:3px solid var(--border);padding:8px 0 8px 10px;margin-bottom:10px;}
.soap-block .label{font-size:0.7rem;color:var(--accent3);font-weight:700;margin-bottom:2px;}
.soap-block .body{font-size:0.82rem;white-space:pre-wrap;}
.record-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;}
.record-card .ts{font-size:0.7rem;color:var(--sub);margin-bottom:6px;}
.gen-time{font-size:0.72rem;color:var(--accent3);}
.tag-nodata{font-size:0.72rem;color:var(--sub);font-style:italic;}
.soap-comment{min-height:44px;margin-top:6px;margin-bottom:0;font-size:0.78rem;}
.comment-view{font-size:0.76rem;color:var(--accent);margin-top:4px;white-space:pre-wrap;}
</style>
</head>
<body>
<header>
  <div>
    <h1>1on1相談（SOAP）</h1>
    <p>FUS-73 ／ 層①：全員が使う記録層</p>
  </div>
  <button class="btn-secondary" onclick="toggleSummary()">柴山さん専用サマリー</button>
</header>
<main id="main-layer1">
  <div class="card">
    <h2>誰の記録か</h2>
    <label for="person-select">氏名（既存を選ぶ、または新規に追加）</label>
    <select id="person-select" onchange="onPersonChange()"></select>
    <input type="text" id="new-person-name" placeholder="新しい氏名を入力してEnter">
    <div id="o-material" class="note"></div>
  </div>

  <div class="card">
    <h2>S（主観的情報）：本人が今日話したこと</h2>
    <textarea id="s-input" placeholder="今日、本人が話した言葉をそのまま書いてください"></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="onSpeakClick()">AIと1on1する</button>
    </div>
    <div id="ai-status" class="note"></div>
  </div>

  <div class="card" id="soap-result-card" style="display:none;">
    <h2>今回のSOAP</h2>
    <div class="btn-row">
      <button class="btn-primary" onclick="saveRecord()">この内容を記録に残す</button>
    </div>
    <div id="soap-result"></div>
  </div>

  <div class="card">
    <h2>これまでの記録</h2>
    <div id="record-history"></div>
  </div>

  <div class="note">
    層①のS/O/A/Pは全員（社長を含む）が使う記録です。層②（柴山さん専用サマリー）はヘッダのボタンから開けます。
  </div>
</main>

<main id="main-layer2" style="display:none;">
  <div class="card">
    <h2>柴山さん専用サマリー（層②）</h2>
    <div class="btn-row">
      <button class="btn-secondary" onclick="toggleSummary()">記録画面へ戻る</button>
    </div>
    <label for="summary-person-select">誰のサマリーを見るか（個別表示）</label>
    <select id="summary-person-select" onchange="renderSummary()"></select>
    <div id="summary-body"></div>
  </div>
</main>

<script>
// ============================================================
// FUS-73（ミツメル1on1・SOAP設計）。データ源は設計２確認済み（2026-08-11）：
// ①1on1機能側に新規roster（'oneon1_roster'）を持つ。既存3ロースターへの
//   強制一致はしない（表記ゆれによる人違いリスクを避けるため）
// ②O材料の紐付けは正規化（前後空白除去・全角半角統一程度）した緩い一致で
//   自動候補を出す。一致しない場合は「見つかりませんでした」と明示し、
//   無理に紐付けない
// ③柴山さんご本人以外の社員の「名前つき日次記録」データソースは現状存在
//   しない（getVisitorIdは匿名IDで社員識別に使えないことを実機確認済み）。
//   社長以外の日次記録は「材料無し」として空欄運用。新規の入力元は作らない
// ============================================================
const ONEON1_ROSTER_KEY = 'oneon1_roster';
const ONEON1_RECORDS_KEY = 'oneon1_records';

function normalizeName(s) {
  return (s || '')
    .trim()
    .replace(/[　\s]+/g, ' ')
    .normalize('NFKC');
}

function loadJson(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch (e) { return fallback; }
}
function saveJson(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

function loadRoster() { return loadJson(ONEON1_ROSTER_KEY, []); }
function saveRoster(list) { saveJson(ONEON1_ROSTER_KEY, list); }
function loadRecords() { return loadJson(ONEON1_RECORDS_KEY, []); }
function saveRecords(list) { saveJson(ONEON1_RECORDS_KEY, list); }

let currentPerson = null;
let lastSoap = null;

function renderPersonSelect() {
  const roster = loadRoster();
  const sel = document.getElementById('person-select');
  sel.innerHTML = '<option value="">（選択してください）</option>' +
    roster.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
  if (currentPerson) sel.value = currentPerson;
}

function onPersonChange() {
  const sel = document.getElementById('person-select');
  currentPerson = sel.value || null;
  renderOMaterial();
  renderHistory();
}

document.getElementById('new-person-name').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  const name = normalizeName(this.value);
  if (!name) return;
  const roster = loadRoster();
  if (!roster.some(p => p.name === name)) {
    roster.push({ name, createdAt: new Date().toISOString() });
    saveRoster(roster);
  }
  this.value = '';
  currentPerson = name;
  renderPersonSelect();
  renderOMaterial();
  renderHistory();
});

// 既存3ロースター（ta_roster/pm_roster/mitsumeru_scan_roster）から、
// 正規化した緩い一致でO材料の自動候補を探す。一致しなければ何も返さない。
function findOMaterial(personName) {
  const target = normalizeName(personName);
  const sources = [
    { key: 'ta_roster', label: 'チームアセスメント／KSA' },
    { key: 'pm_roster', label: 'PMチェック' },
    { key: 'mitsumeru_scan_roster', label: 'エゴグラム／エニアグラム' },
  ];
  const found = [];
  sources.forEach(src => {
    const list = loadJson(src.key, []);
    const hit = list.find(r => normalizeName(r.name) === target);
    if (hit) found.push({ label: src.label, record: hit });
  });
  return found;
}

function renderOMaterial() {
  const box = document.getElementById('o-material');
  if (!currentPerson) { box.textContent = ''; return; }
  const materials = findOMaterial(currentPerson);
  if (materials.length === 0) {
    box.innerHTML = `<span class="tag-nodata">${currentPerson}さんのO材料（適性検査結果）は見つかりませんでした。無理に紐付けていません。</span>`;
    return;
  }
  box.innerHTML = 'O材料：' + materials.map(m => m.label).join('・') + ' が見つかりました（自動紐付け・正規化した緩い一致）。';
}

function buildOSummaryText(personName) {
  const materials = findOMaterial(personName);
  if (materials.length === 0) return 'O材料（適性検査結果）：見つかりませんでした。';
  return 'O材料（適性検査結果・既存ロースターから自動紐付け）：\n' +
    materials.map(m => `- ${m.label}：${JSON.stringify(m.record)}`).join('\n');
}

function onSpeakClick() {
  if (!currentPerson) { alert('先に氏名を選択または追加してください。'); return; }
  const sInput = document.getElementById('s-input').value.trim();
  if (!sInput) { alert('S（本人が話したこと）を入力してください。'); return; }
  const key = mitsumeruGetApiKey('mitsumeru_api_key');
  const status = document.getElementById('ai-status');
  if (!key) { status.textContent = MITSUMERU_MSG.apiKeyNotConfigured; return; }

  const oSummary = buildOSummaryText(currentPerson);
  const prompt = `あなたは1on1の相談相手です。以下の情報をSOAP形式（医療カルテと同じ考え方）で整理してください。
S（主観的情報）＝本人が話した言葉そのもの。O（客観的情報）＝日次記録や適性検査データ。
A（評価）＝SとOを合わせて、表面の訴えの奥にある本質（氷山モデル）で見立てる。
P（計画）＝次の一手。
「最近どうですか」のような開かれすぎた/馴れ馴れしい聞き方はせず、具体的な事実に基づいて書いてください。
記録にない事実を創作しないこと。

【S：本人が話したこと】
${sInput}

【O：客観的情報】
${oSummary}

以下の形式で出力してください（他のテキストは不要）：
===S===
（Sの要約）
===O===
（Oの要約）
===A===
（見立て）
===P===
（次の一手）`;

  status.textContent = '生成中…';
  mitsumeruCallClaude('mitsumeru_api_key', prompt,
    text => {
      status.textContent = '';
      lastSoap = parseSoap(text);
      renderSoapResult(lastSoap);
    },
    err => { status.textContent = 'エラー：' + err; },
    2000
  );
}

function parseSoap(text) {
  const get = (name) => {
    const re = new RegExp('===' + name + '===\\s*([\\s\\S]*?)(?:===|$)');
    const m = text.match(re);
    return m ? m[1].trim() : '';
  };
  return { S: get('S'), O: get('O'), A: get('A'), P: get('P') };
}

function renderSoapResult(soap) {
  const card = document.getElementById('soap-result-card');
  const box = document.getElementById('soap-result');
  card.style.display = 'block';
  // FUS-215①：O/A/Pへの補足コメント欄。Sは本人の生発言のためコメント対象外。
  const rows = [['S', soap.S, false], ['O', soap.O, true], ['A', soap.A, true], ['P', soap.P, true]];
  box.innerHTML = rows.map(([label, body, hasComment]) =>
    `<div class="soap-block"><div class="label">${label}</div><div class="body">${escapeHtml(body || '（空）')}</div>` +
    (hasComment ? `<textarea class="soap-comment" id="comment-${label}" placeholder="${label}への補足コメント（任意・相手の名前を含めてよい。自動突合は今回のスコープ外）"></textarea>` : '') +
    `</div>`
  ).join('');
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function saveRecord() {
  if (!currentPerson || !lastSoap) return;
  const records = loadRecords();
  // FUS-215①：O/A/Pコメント欄の内容を記録へ含める（空欄は空文字のまま保存）
  const comments = {
    O: (document.getElementById('comment-O') || { value: '' }).value.trim(),
    A: (document.getElementById('comment-A') || { value: '' }).value.trim(),
    P: (document.getElementById('comment-P') || { value: '' }).value.trim(),
  };
  records.push({
    person: currentPerson,
    ts: new Date().toISOString(),
    soap: lastSoap,
    comments,
  });
  saveRecords(records);
  document.getElementById('s-input').value = '';
  document.getElementById('soap-result-card').style.display = 'none';
  lastSoap = null;
  renderHistory();
}

// FUS-215②：個別記録のPDF出力用キャッシュ（renderHistory直近描画分のみ・indexで参照）
let historyRecordsCache = [];
let summaryRecordsCache = [];

let editingHistoryIndex = null;

function renderHistory() {
  const box = document.getElementById('record-history');
  if (!currentPerson) { box.innerHTML = '<div class="empty-state">氏名を選択すると、これまでの記録が表示されます。</div>'; return; }
  const records = loadRecords().filter(r => r.person === currentPerson).sort((a, b) => b.ts.localeCompare(a.ts));
  historyRecordsCache = records;
  if (records.length === 0) { box.innerHTML = `<div class="empty-state">${currentPerson}さんの記録はまだありません（対象0件）。</div>`; return; }
  box.innerHTML = records.map((r, i) => {
    const editing = editingHistoryIndex === i;
    const soapRow = (label) => {
      const hasComment = ['O', 'A', 'P'].includes(label);
      const commentVal = (r.comments && r.comments[label]) || '';
      const commentHtml = editing && hasComment
        ? `<textarea class="soap-comment" id="edit-comment-${label}-${i}" placeholder="${label}への補足コメント">${escapeHtml(commentVal)}</textarea>`
        : (commentVal ? `<div class="comment-view">💬 ${escapeHtml(commentVal)}</div>` : '');
      return `<div class="soap-block"><div class="label">${label}</div><div class="body">${escapeHtml(r.soap[label] || '（空）')}</div>${commentHtml}</div>`;
    };
    const actionButtons = editing
      ? `<div class="btn-row">
           <button class="btn-primary" onclick="saveHistoryComment(${i})">✅ コメントを保存</button>
           <button class="btn-secondary" onclick="cancelEditHistoryComment()">キャンセル</button>
         </div>`
      : `<div class="btn-row">
           <button class="btn-secondary" onclick="printRecord(${i})">🖨️ この記録をPDF保存</button>
           <button class="btn-secondary" onclick="startEditHistoryComment(${i})">✏️ コメントを編集</button>
         </div>`;
    return `
    <div class="record-card">
      ${actionButtons}
      <div class="ts">${new Date(r.ts).toLocaleString('ja-JP')}</div>
      ${soapRow('O')}
      ${soapRow('A')}
      ${soapRow('P')}
    </div>`;
  }).join('');
}

// 柴山さん実機指摘対応（2026-08-15）：「過去の記録をコメント修正できないのか」への対応。
// 保存後の記録に対しても、O/A/Pコメントを後から編集できるようにする（S・O・A・P本文自体は不変。編集対象はコメントのみ）。
function startEditHistoryComment(index) {
  editingHistoryIndex = index;
  renderHistory();
}
function cancelEditHistoryComment() {
  editingHistoryIndex = null;
  renderHistory();
}
function saveHistoryComment(index) {
  const target = historyRecordsCache[index];
  if (!target) return;
  const newComments = {
    O: (document.getElementById(`edit-comment-O-${index}`) || { value: target.comments?.O || '' }).value.trim(),
    A: (document.getElementById(`edit-comment-A-${index}`) || { value: target.comments?.A || '' }).value.trim(),
    P: (document.getElementById(`edit-comment-P-${index}`) || { value: target.comments?.P || '' }).value.trim(),
  };
  // ts＋personで対象を特定し、全件配列（未フィルタ）の該当レコードだけを書き換える。
  const all = loadRecords();
  const idx = all.findIndex(r => r.person === target.person && r.ts === target.ts);
  if (idx === -1) return;
  all[idx].comments = newComments;
  saveRecords(all);
  editingHistoryIndex = null;
  renderHistory();
}

// FUS-215②：個別記録のPDF出力。mitsumeru_scan.htmlの既存パターン（別ウィンドウ＋window.print()）を流用。
// 新規ライブラリは導入しない。
function printRecord(index) {
  const r = historyRecordsCache[index];
  if (!r) return;
  const rows = ['S', 'O', 'A', 'P'].map(k => `
    <div class="block"><div class="label">${k}</div><div class="body">${escapeHtml(r.soap[k] || '（空）')}</div>${r.comments && r.comments[k] ? `<div class="comment">💬 ${escapeHtml(r.comments[k])}</div>` : ''}</div>`).join('');
  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<title>1on1記録 ${escapeHtml(r.person)} ${new Date(r.ts).toLocaleDateString('ja-JP')}</title>
<style>
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;color:#111;padding:24px;max-width:700px;margin:0 auto;}
h1{font-size:1.1rem;color:#0277bd;margin-bottom:4px;}
.meta{font-size:0.8rem;color:#555;margin-bottom:16px;}
.block{border-left:3px solid #ccc;padding:8px 0 8px 10px;margin-bottom:12px;}
.block .label{font-size:0.75rem;color:#e65100;font-weight:700;margin-bottom:2px;}
.block .body{font-size:0.88rem;white-space:pre-wrap;}
.comment{font-size:0.8rem;color:#0277bd;margin-top:4px;white-space:pre-wrap;}
@media print{button{display:none;} body{padding:0;}}
</style></head><body>
<h1>1on1相談記録</h1>
<div class="meta">${escapeHtml(r.person)} 様／${new Date(r.ts).toLocaleString('ja-JP')}</div>
${rows}
<button onclick="window.print()" style="margin-top:16px;padding:8px 20px;background:#0277bd;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">🖨️ 印刷 / PDF保存</button>
</body></html>`;
  const w = window.open('', '_blank', 'width=700,height=800');
  w.document.write(html);
  w.document.close();
}

// 柴山さん実機指摘対応（2026-08-15）：層②で表示中の記録をまとめて1つのPDFへ。
// printRecord()と同じパターン（別ウィンドウ＋window.print()）を流用、複数件を連結するだけ。
function printSummaryBatch() {
  if (!summaryRecordsCache || summaryRecordsCache.length === 0) return;
  const personName = summaryRecordsCache[0].person;
  const blocks = summaryRecordsCache.map(r => {
    const rows = ['S', 'O', 'A', 'P'].map(k => `
      <div class="block"><div class="label">${k}</div><div class="body">${escapeHtml(r.soap[k] || '（空）')}</div>${r.comments && r.comments[k] ? `<div class="comment">💬 ${escapeHtml(r.comments[k])}</div>` : ''}</div>`).join('');
    return `<div class="record"><div class="meta">${new Date(r.ts).toLocaleString('ja-JP')}</div>${rows}</div>`;
  }).join('<hr class="sep">');
  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<title>1on1記録一括 ${escapeHtml(personName)}</title>
<style>
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;color:#111;padding:24px;max-width:700px;margin:0 auto;}
h1{font-size:1.1rem;color:#0277bd;margin-bottom:4px;}
.meta{font-size:0.8rem;color:#555;margin-bottom:16px;}
.block{border-left:3px solid #ccc;padding:8px 0 8px 10px;margin-bottom:12px;}
.block .label{font-size:0.75rem;color:#e65100;font-weight:700;margin-bottom:2px;}
.block .body{font-size:0.88rem;white-space:pre-wrap;}
.comment{font-size:0.8rem;color:#0277bd;margin-top:4px;white-space:pre-wrap;}
.sep{border:none;border-top:1px dashed #ccc;margin:20px 0;}
.record{page-break-inside:avoid;}
@media print{button{display:none;} body{padding:0;}}
</style></head><body>
<h1>1on1相談記録（一括・${escapeHtml(personName)}様）</h1>
<div class="meta">${summaryRecordsCache.length}件・出力日時：${new Date().toLocaleString('ja-JP')}</div>
${blocks}
<button onclick="window.print()" style="margin-top:16px;padding:8px 20px;background:#0277bd;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">🖨️ 印刷 / PDF保存</button>
</body></html>`;
  const w = window.open('', '_blank', 'width=700,height=800');
  w.document.write(html);
  w.document.close();
}

// ===== 層②：柴山さん専用サマリー =====
// ⚠️未確定（設計書「未確定・次の壁打ちで詰めること」）：具体的な表示項目・強い認証は
// 今回のスコープ外。現時点では画面の切替のみで、全員分の記録件数・最新の見立てを一覧表示する。
function toggleSummary() {
  const l1 = document.getElementById('main-layer1');
  const l2 = document.getElementById('main-layer2');
  const showSummary = l2.style.display === 'none';
  l1.style.display = showSummary ? 'none' : 'block';
  l2.style.display = showSummary ? 'block' : 'none';
  if (showSummary) { renderSummaryPersonSelect(); renderSummary(); }
}

// FUS-215追加是正：柴山さんご本人の指摘（2026-08-15）「全員が1画面に混在している」に対応。
// 層①と同じ「まず人を選ぶ」方式へ変更。個別表示のみ・全員一覧表示はしない。
function renderSummaryPersonSelect() {
  const roster = loadRoster();
  const sel = document.getElementById('summary-person-select');
  const prev = sel.value;
  sel.innerHTML = '<option value="">（選択してください）</option>' +
    roster.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
  if (prev) sel.value = prev;
}

// FUS-215③：「最新のA・Pのみ」から「直近N件を時系列で並べた総括」へ拡張。
// キーワード・傾向の自動検知は今回スコープ外（過剰実装を避け、表示範囲を広げるだけに留める）。
const SUMMARY_RECENT_N = 5;

function renderSummary() {
  const box = document.getElementById('summary-body');
  const selectedName = document.getElementById('summary-person-select').value;
  if (!selectedName) {
    box.innerHTML = '<div class="empty-state">上のプルダウンで、見たい人を選んでください（個別表示のみ・複数人の同時表示はしません）。</div>';
    return;
  }
  const records = loadRecords().filter(r => r.person === selectedName);
  if (records.length === 0) {
    box.innerHTML = `<div class="empty-state">${escapeHtml(selectedName)}さんの記録はまだありません。</div>`;
    return;
  }
  const list = records.sort((a, b) => b.ts.localeCompare(a.ts));
  const recent = list.slice(0, SUMMARY_RECENT_N);
  summaryRecordsCache = recent;
  const timeline = recent.map(r => `
      <div class="record-card">
        <div class="ts">${new Date(r.ts).toLocaleString('ja-JP')}</div>
        <div class="soap-block"><div class="label">O</div><div class="body">${escapeHtml(r.soap.O || '（空）')}</div>${r.comments && r.comments.O ? `<div class="comment-view">💬 ${escapeHtml(r.comments.O)}</div>` : ''}</div>
        <div class="soap-block"><div class="label">A</div><div class="body">${escapeHtml(r.soap.A || '（空）')}</div>${r.comments && r.comments.A ? `<div class="comment-view">💬 ${escapeHtml(r.comments.A)}</div>` : ''}</div>
        <div class="soap-block"><div class="label">P</div><div class="body">${escapeHtml(r.soap.P || '（空）')}</div>${r.comments && r.comments.P ? `<div class="comment-view">💬 ${escapeHtml(r.comments.P)}</div>` : ''}</div>
      </div>`).join('');
  box.innerHTML = `<div class="card">
      <div class="summary-heading-row" style="display:flex;justify-content:space-between;align-items:center;">
        <h2>${escapeHtml(selectedName)}（記録${list.length}件・直近${recent.length}件を表示）</h2>
        <button class="btn-secondary" onclick="printSummaryBatch()">🖨️ まとめてPDF保存</button>
      </div>
      ${timeline}
    </div>` + `<div class="note">${escapeHtml(selectedName)}さんの直近${SUMMARY_RECENT_N}件までを時系列（新しい順）で表示。繰り返し・傾向の自動検知はしていません（表示範囲の拡張のみ）。定義：${new Date().toLocaleString('ja-JP')}時点</div>`;
}

function init() {
  renderPersonSelect();
  renderOMaterial();
  renderHistory();
}
init();
</script>
</body>
